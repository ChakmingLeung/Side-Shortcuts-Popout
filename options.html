<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>侧栏快捷小窗 - 设置</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body data-doc-title="docTitleOptions">
    <div class="page">
      <header class="header">
        <h1 data-i18n="optionsTitle">快捷入口管理</h1>
        <p class="subtitle" data-i18n="optionsSubtitle">
          配置快捷入口。侧栏纵向列出，点击即在独立小窗打开，与主窗口并排浏览。
        </p>
      </header>

      <section class="card">
        <h2 data-i18n="globalSettings">全局设置</h2>
        <label class="field">
          <span data-i18n="language">界面语言</span>
          <select id="language">
            <option value="auto" data-i18n="languageAuto">跟随浏览器</option>
            <option value="zh" data-i18n="languageZh">简体中文</option>
            <option value="en" data-i18n="languageEn">English</option>
          </select>
        </label>
        <label class="toggle-row">
          <input type="checkbox" id="default-mobile" checked />
          <span data-i18n="defaultMobile">默认以移动版在小窗打开</span>
        </label>
        <p class="field-hint" data-i18n="pinToolbarHint">
          建议将本扩展固定到工具栏：扩展图标（拼图）→「侧栏快捷小窗」→ 图钉。
        </p>
        <p class="field-hint" data-i18n="storagePersistHint">
          快捷方式会自动保存在本机；登录 Chrome/Edge 并开启同步后可同步到其他设备。重新加载扩展不会清空配置。
        </p>
        <p class="field-hint" data-i18n="defaultMobileHint">
          抖音等站点保持你填写的 www 地址（不转到 m. 域，避免 404），并优化侧栏嵌入；B 站等可按白名单转换移动域名。不会修改已保存的网址。
        </p>
      </section>

      <section class="card">
        <h2 id="form-title" data-i18n="addShortcut">添加快捷入口</h2>
        <form id="shortcut-form" class="form">
          <input type="hidden" id="edit-id" value="" />
          <label class="field">
            <span data-i18n="fieldName">名称</span>
            <input
              type="text"
              id="title"
              required
              maxlength="40"
              data-i18n="placeholderTitle"
              data-i18n-attr="placeholder"
              placeholder="例如：语雀"
            />
          </label>
          <label class="field">
            <span data-i18n="fieldUrl">网址</span>
            <input
              type="url"
              id="url"
              required
              data-i18n="placeholderUrl"
              data-i18n-attr="placeholder"
              placeholder="https://example.com"
            />
          </label>
          <p class="field-hint" data-i18n="fieldFaviconHint">
            图标将根据网址自动显示网站 favicon，无需配置。
          </p>
          <label class="field">
            <span data-i18n="fieldOpenMode">打开方式</span>
            <select id="mobile-mode">
              <option value="inherit" data-i18n="openModeInherit">
                跟随全局（默认移动版）
              </option>
              <option value="on" data-i18n="openModeOn">始终移动版</option>
              <option value="off" data-i18n="openModeOff">始终桌面版</option>
            </select>
          </label>
          <p id="form-error" class="error" hidden></p>
          <div class="form-actions">
            <button type="submit" class="btn primary" id="btn-save" data-i18n="btnSave">
              保存
            </button>
            <button
              type="button"
              class="btn ghost"
              id="btn-cancel"
              hidden
              data-i18n="btnCancel"
            >
              取消编辑
            </button>
          </div>
        </form>
      </section>

      <section class="card">
        <h2 data-i18n="savedShortcuts">已保存的入口</h2>
        <ul id="manage-list" class="manage-list"></ul>
        <p id="manage-empty" class="empty" hidden data-i18n="manageEmpty">暂无快捷入口</p>
      </section>
    </div>
    <script type="module" src="options.js"></script>
  </body>
</html>
