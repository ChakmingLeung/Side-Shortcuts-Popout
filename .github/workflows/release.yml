name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read version
        id: ver
        run: echo "version=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Pack extension zip
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          STAGE="${GITHUB_WORKSPACE}/dist/stage"
          ZIP="${GITHUB_WORKSPACE}/dist/Side-Shortcuts-Popout-v${VERSION}.zip"
          rm -rf "${GITHUB_WORKSPACE}/dist"
          mkdir -p "$STAGE"
          cp manifest.json background.js launcher.js launcher-list.js mobile-ua.js popout.js popout-resume.js context-menu.js default-shortcuts.js shared.js sidebar-embed.js theme.js theme.css launcher-ui.css backup.js i18n.js \
            sidepanel.html sidepanel.js sidepanel.css \
            popup.html popup.js popup.css \
            options.html options.js options.css \
            LICENSE "$STAGE/"
          cp -r icons _locales "$STAGE/"
          rm -f "$STAGE/icons/source.png" 2>/dev/null || true
          (cd "$STAGE" && zip -rq "$ZIP" .)
          test -f "$ZIP"
          ls -la "${GITHUB_WORKSPACE}/dist/"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          ZIP="dist/Side-Shortcuts-Popout-v${{ steps.ver.outputs.version }}.zip"
          test -f "$ZIP"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --generate-notes --title "Side Shortcuts Popout $TAG"
          fi

      - name: Upload zip artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v5
        with:
          name: Side-Shortcuts-Popout-v${{ steps.ver.outputs.version }}
          path: dist/Side-Shortcuts-Popout-v${{ steps.ver.outputs.version }}.zip
