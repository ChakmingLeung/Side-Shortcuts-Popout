name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read version
        id: ver
        run: echo "version=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Pack extension zip
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          STAGE="dist/stage"
          ZIP="dist/Side-Shortcuts-Popout-v${VERSION}.zip"
          mkdir -p "$STAGE" dist
          cp manifest.json background.js shared.js i18n.js \
            sidepanel.html sidepanel.js sidepanel.css \
            options.html options.js options.css \
            LICENSE README.zh-CN.md "$STAGE/"
          cp -r icons _locales "$STAGE/"
          rm -f "$STAGE/icons/source.png" 2>/dev/null || true
          cd "$STAGE" && zip -r "../../${ZIP}" .
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/Side-Shortcuts-Popout-v${{ steps.ver.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
